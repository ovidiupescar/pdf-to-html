services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pdf2html-backend
    environment:
      - PORT=8000
      - OUTPUT_DIR=/app/output
      # Adaugă aici API keys din Dokploy UI (OPENAI_API_KEY, etc.)
    expose:
      - 8000
    volumes:
      - pdf2html_output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: pdf2html-frontend
    environment:
      - API_HOST=backend          # ← numele serviciului din docker-compose
      - API_PORT=8000
      - PORT=3000
    expose:
      - 3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pdf2html_output: